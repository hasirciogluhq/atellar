version: 2

# GoReleaser is used only to ship the atellar CLI through Homebrew.
# The linux tarball, install.sh and the GitHub Release itself are still
# produced by scripts/release/* and the "Publish GitHub Release" step.
project_name: atellar

before:
  hooks:
    - go mod tidy

builds:
  - id: atellar
    main: ./cmd/atellar
    binary: atellar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/hasirciogluhq/atellar/pkg/version.Version={{.Tag}}

archives:
  - id: atellar
    name_template: "atellar_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "atellar_checksums.txt"

# The release already exists (created by the workflow), so only attach files.
release:
  mode: append

changelog:
  disable: true

brews:
  - name: atellar
    repository:
      owner: hasirciogluhq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/hasirciogluhq/atellar"
    description: "Kubernetes-like hosting infrastructure CLI"
    commit_author:
      name: atellar-bot
      email: bot@users.noreply.github.com
    install: |
      bin.install "atellar"
    test: |
      system "#{bin}/atellar", "--version"
