services:
  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgresql://postgres:1234@host.docker.internal:5432/atellar_cp?sslmode=disable
      MIGRATIONS_PATH: /usr/share/atellar/migrations
      PORT: "8080"
      GRPC_PORT: "9090"
      CLUSTER_OVERLAY_CIDR: 10.0.0.0/8
      NODE_SUBNET_PREFIX_LEN: "24"

volumes:
  pgdata:
