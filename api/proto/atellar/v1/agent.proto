syntax = "proto3";

package atellar.v1;

option go_package = "github.com/hasirciogluhq/atellar/internal/grpc/gen/atellar/v1;atellarv1";

service AgentService {
  rpc Connect(stream AgentEnvelope) returns (stream ServerEnvelope);
  rpc RenewNodeAPIKey(RenewNodeAPIKeyRequest) returns (RenewNodeAPIKeyResponse);
  rpc GetClusterNetworkState(GetClusterNetworkStateRequest) returns (GetClusterNetworkStateResponse);
  rpc GetNodeWorkloads(GetNodeWorkloadsRequest) returns (GetNodeWorkloadsResponse);
  rpc ReportContainerRuntime(ReportContainerRuntimeRequest) returns (ReportContainerRuntimeResponse);
  rpc AllocateContainerOverlayIP(AllocateContainerOverlayIPRequest) returns (AllocateContainerOverlayIPResponse);
  rpc ReportNodeHardware(ReportNodeHardwareRequest) returns (ReportNodeHardwareResponse);
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_SYNC = 1;
  DELIVERY_MODE_ASYNC = 2;
}

message AgentEnvelope {
  string correlation_id = 1;
  oneof payload {
    Heartbeat heartbeat = 2;
    Ingest ingest = 3;
    RpcResult rpc_result = 4;
  }
}

message ServerEnvelope {
  string correlation_id = 1;
  oneof payload {
    HeartbeatAck heartbeat_ack = 2;
    RpcCall rpc_call = 3;
    IngestAck ingest_ack = 4;
  }
}

message Heartbeat {
  int64 timestamp_unix = 1;
}

message HeartbeatAck {
  int64 timestamp_unix = 1;
}

message Ingest {
  string event_type = 1;
  bytes payload = 2;
}

message IngestAck {
  bool accepted = 1;
  string message = 2;
}

message RpcCall {
  string method = 1;
  bytes payload = 2;
  DeliveryMode mode = 3;
}

message RpcResult {
  bytes payload = 1;
  string error = 2;
}

message RenewNodeAPIKeyRequest {}

message RenewNodeAPIKeyResponse {
  string node_api_key = 1;
  int64 expires_at_unix = 2;
}

message GetClusterNetworkStateRequest {}

message ClusterNode {
  string id = 1;
  string overlay_ip = 2;
  string overlay_subnet = 3;
  string status = 4;
}

message ClusterContainer {
  string id = 1;
  string node_id = 2;
  string overlay_ip = 3;
  string status = 4;
}

message GetClusterNetworkStateResponse {
  repeated ClusterNode nodes = 1;
  repeated ClusterContainer containers = 2;
}

message GetNodeWorkloadsRequest {}

message Workload {
  string id = 1;
  string image = 2;
  repeated string command = 3;
  repeated string entrypoint = 4;
  map<string, string> env = 5;
  string working_dir = 6;
  string containerd_ns = 7;
  string status = 8;
  string restart_policy = 9;
  string overlay_ip = 10;
  int32 restart_count = 11;
  double cpu_limit = 12;
  int32 cpu_shares = 13;
  int32 memory_limit_mib = 14;
  string image_digest = 15;
  int64 last_failed_at_unix = 16;
  string error_message = 17;
}

message GetNodeWorkloadsResponse {
  repeated Workload workloads = 1;
}

message ReportContainerRuntimeRequest {
  string container_id = 1;
  string containerd_id = 2;
  string snapshot_key = 3;
  int32 task_pid = 4;
  string image_digest = 5;
  string overlay_ip = 6;
  string status = 7;
  int32 exit_code = 8;
  string error_message = 9;
  int32 restart_count = 10;
  int64 last_failed_at_unix = 11;
}

message ReportContainerRuntimeResponse {
  string overlay_ip = 1;
}

message AllocateContainerOverlayIPRequest {
  string container_id = 1;
}

message AllocateContainerOverlayIPResponse {
  string overlay_ip = 1;
}

message ReportNodeHardwareRequest {
  int32 cpu_cores = 1;
  int32 memory_total_mib = 2;
  int32 disk_total_gib = 3;
  string hostname = 4;
  string os = 5;
  string arch = 6;
  string kernel_version = 7;
}

message ReportNodeHardwareResponse {}
